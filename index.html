<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester Average Calculator — ESSAT</title>
<style>
  /* كل الـ CSS اللي عندك (نفس الكود السابق بدون تغيير) */
  :root {
    --card:   rgba(10,14,26,0.82);
    --border: rgba(255,255,255,0.09);
    --brd2:   rgba(255,255,255,0.14);
    --text:   #e6edf3;
    --muted:  #8b949e;
    --dim:    #30363d;
    --green:  #34d399;
    --amber:  #fbbf24;
    --red:    #f87171;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    animation: hueShift 12s linear infinite;
    direction: rtl;
    text-align: right;
  }
  /* ... (كل الـ styles السابقة تبقى كما هي) ... */
  /* سأضعها كاملة في النهاية إذا أردت */
</style>
</head>
<body>
<!-- كل الـ HTML الخاص بك (نفس اللي أرسلته) -->
<div class="page">
  <!-- ... باقي الـ HTML كامل ... -->
</div>

<script>
// ── state ──────────────────────────────────────────────────
const DEFAULT_MODS = ["تحليل", "فيزياء", "كيمياء", "معلوماتية", "رياضيات عددية", "ميكانيكا", "مقاومة المواد", "هندسة", "كهرباء", "إنجليزي", "فرنسية"];
const PALETTE = ["#6ee7f7","#a78bfa","#f472b6","#34d399","#fbbf24","#fb923c","#4f8ef7","#2dd4bf","#f87171","#94a3b8","#c084fc"];

let rows = [];
let nextId = 0;

function getColor(idx) {
  return PALETTE[idx % PALETTE.length];
}

// ── init ───────────────────────────────────────────────────
function init() {
  DEFAULT_MODS.forEach((name, i) => {
    rows.push({ id: nextId++, name, color: getColor(i) });
  });
  renderAll();
}

// ── render ─────────────────────────────────────────────────
function renderAll() {
  const container = document.getElementById('rows');
  container.innerHTML = '';
  rows.forEach((r, idx) => {
    container.appendChild(buildRow(r, idx));
  });
}

function escHtml(unsafe) {
  return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function buildRow(r) {
  const div = document.createElement('div');
  div.className = 'mod-row cols';
  div.dataset.id = r.id;
  div.innerHTML = `
    <div class="mod-name-wrap">
      <span class="dot" style="background:${r.color}"></span>
      <input class="mod-name" type="text" value="${escHtml(r.name)}" 
             onchange="renameRow(${r.id}, this.value)">
    </div>
    <input class="inp" id="exam-\( {r.id}" type="number" min="0" max="20" step="0.01" placeholder="—" oninput="live( \){r.id})">
    <input class="inp" id="cc-\( {r.id}"   type="number" min="0" max="20" step="0.01" placeholder="—" oninput="live( \){r.id})">
    <input class="inp" id="cf-\( {r.id}"   type="number" min="1" max="9"  step="1"    placeholder="1" value="1" oninput="live( \){r.id})">
    <div class="live mono" id="av-${r.id}">—</div>
    <div class="live mono" id="wv-${r.id}">—</div>
    <button class="del-btn" onclick="deleteRow(${r.id})" title="حذف المقياس">✕</button>
  `;
  return div;
}

function renameRow(id, newName) {
  const row = rows.find(r => r.id === id);
  if (row) row.name = newName.trim() || "مقياس";
}

// ── Live Calculation ───────────────────────────────────────
function live(id) {
  const exam = parseFloat(document.getElementById(`exam-${id}`).value) || 0;
  const cc   = parseFloat(document.getElementById(`cc-${id}`).value)   || 0;
  const cf   = parseFloat(document.getElementById(`cf-${id}`).value)   || 1;

  const avg = (exam * 0.6 + cc * 0.4);
  const wv  = avg * cf;

  document.getElementById(`av-${id}`).textContent = avg.toFixed(2);
  document.getElementById(`wv-${id}`).textContent = wv.toFixed(2);

  // color
  const liveEl = document.getElementById(`av-${id}`);
  liveEl.className = 'live mono';
  if (avg >= 15) liveEl.classList.add('ok');
  else if (avg >= 10) liveEl.classList.add('mid');
  else liveEl.classList.add('bad');
}

// ── Delete Row ─────────────────────────────────────────────
function deleteRow(id) {
  rows = rows.filter(r => r.id !== id);
  renderAll();
}

// ── Add Row ────────────────────────────────────────────────
function addRow() {
  rows.push({ 
    id: nextId++, 
    name: "مقياس جديد", 
    color: getColor(rows.length) 
  });
  renderAll();
}

// ── Calculate Final Average ────────────────────────────────
function calculate() {
  let totalWeighted = 0;
  let totalCoef = 0;

  const resContainer = document.getElementById('res-rows');
  resContainer.innerHTML = '';

  rows.forEach(r => {
    const exam = parseFloat(document.getElementById(`exam-${r.id}`).value) || 0;
    const cc   = parseFloat(document.getElementById(`cc-${r.id}`).value)   || 0;
    const cf   = parseFloat(document.getElementById(`cf-${r.id}`).value)   || 1;

    const avg = (exam * 0.6 + cc * 0.4);
    const weighted = avg * cf;

    totalWeighted += weighted;
    totalCoef += cf;

    // result row
    const rowDiv = document.createElement('div');
    rowDiv.className = 'res-row res-cols';
    rowDiv.innerHTML = `
      <div>${r.name}</div>
      <div>${exam.toFixed(2)}</div>
      <div>${cc.toFixed(2)}</div>
      <div>${cf}</div>
      <div>${avg.toFixed(2)}</div>
      <div>${weighted.toFixed(2)}</div>
      <div><span class="pill \( {avg>=15?'ok':avg>=10?'mid':'bad'}"> \){avg>=15?'ممتاز':avg>=10?'جيد':'ضعيف'}</span></div>
    `;
    resContainer.appendChild(rowDiv);
  });

  const finalAvg = totalCoef > 0 ? (totalWeighted / totalCoef) : 0;

  document.getElementById('fn').textContent = finalAvg.toFixed(2);

  const verdict = document.getElementById('fv');
  verdict.textContent = finalAvg >= 15 ? "ممتاز" : finalAvg >= 13 ? "جيد جداً" : finalAvg >= 10 ? "جيد" : "ضعيف";
  verdict.className = `final-verdict ${finalAvg>=15?'ok':finalAvg>=10?'mid':'bad'}`;

  document.getElementById('bf').style.width = Math.min(100, finalAvg * 5) + '%';

  document.getElementById('results').style.display = 'block';
}

// Initialize
window.onload = init;
</script>
</body>
</html>
